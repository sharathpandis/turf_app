<input aria-label="Digit 4" value="" style="height: 56px; border: 2px solid #0E6B43; border-radius: 12px; text-align: center; font: 600 22px 'Space Grotesk', sans-serif; color: #13201A; background: #E3F1E9; min-width: 0">

<span>Code valid for 10 minutes</span>
<span>Resend in <strong style="color: #13201A">0:42</strong></span>
</div>
<div style="flex: 1"></div>
<button style="height: 52px; border: 0; border-radius: 12px; background: #0E6B43; color: #FFFFFF; font: 600 16px Inter, sans-serif">Verify and continue</button>
<p style="margin: 16px 0 0; font-size: 13px; color: #5B6B63; text-align: center; line-height: 1.5">Tip: type the code here. Opening the email on another phone still works.</p>
