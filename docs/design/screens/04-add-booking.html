<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add booking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B43}a:hover{color:#09502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #5E6662; font-family: Inter, sans-serif; color: #13201A; display: flex; flex-direction: column; justify-content: flex-end">
<div style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #E2E6E1; align-self: center"></div>
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">New booking</h1>
<div style="font-size: 14px; color: #5B6B63">Turf 1 · Tue 17 Nov · 10–11 PM</div>
</div>
<button aria-label="Close" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #F6F7F4; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13201A" stroke-width="2" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #5B6B63">Phone number<input value="98765 43210" style="height: 48px; border: 1.5px solid #E2E6E1; border-radius: 12px; padding: 0 14px; font: 500 16px Inter, sans-serif; color: #13201A; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #5B6B63">Name<input value="Rahul FC" style="height: 48px; border: 1.5px solid #E2E6E1; border-radius: 12px; padding: 0 14px; font: 500 16px Inter, sans-serif; color: #13201A; background: #FFFFFF"></label>
<div style="font-size: 13px; color: #0E6B43; font-weight: 600; margin-top: -8px">Regular · 12 bookings · 0 no-shows</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; color: #5B6B63">Booked via</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #13201A; color: #FFFFFF; font: 600 13px Inter, sans-serif">Phone</button>
<button style="height: 40px; padding: 0 14px; border: 1.5px solid #E2E6E1; border-radius: 999px; background: #FFFFFF; color: #13201A; font: 600 13px Inter, sans-serif">Walk-in</button>
<button style="height: 40px; padding: 0 14px; border: 1.5px solid #E2E6E1; border-radius: 999px; background: #FFFFFF; color: #13201A; font: 600 13px Inter, sans-serif">Other app</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #5B6B63">Price<input value="₹1,500" style="height: 48px; border: 1.5px solid #E2E6E1; border-radius: 12px; padding: 0 14px; font: 600 16px 'Space Grotesk', sans-serif; color: #13201A; background: #FFFFFF; min-width: 0"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #5B6B63">Advance received<input value="₹500" style="height: 48px; border: 1.5px solid #E2E6E1; border-radius: 12px; padding: 0 14px; font: 600 16px 'Space Grotesk', sans-serif; color: #13201A; background: #FFFFFF; min-width: 0"></label>
</div>
<div style="display: flex; gap: 8px; margin-top: -4px">
<span style="font-size: 12px; font-weight: 600; color: #7A4A00; background: #FFF1D6; padding: 4px 10px; border-radius: 999px">Peak price</span>
<button style="height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: #E3F1E9; color: #0E6B43; font: 600 12px Inter, sans-serif">Cash</button>
<button style="height: 32px; padding: 0 12px; border: 1.5px solid #E2E6E1; border-radius: 999px; background: #FFFFFF; color: #13201A; font: 600 12px Inter, sans-serif">UPI at counter</button>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #13201A"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0E6B43">Send WhatsApp confirmation</label>
<button style="height: 52px; border: 0; border-radius: 12px; background: #0E6B43; color: #FFFFFF; font: 600 16px Inter, sans-serif">Save booking · balance ₹1,000</button>
</div>
</div>
</x-dc>

</html>
